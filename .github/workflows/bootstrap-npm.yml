name: Bootstrap npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with new-package staging support
        run: npm install --global 'npm@^11.21.0'

      - name: Check package does not already exist
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@dice-roller/convertor' || pkg.version !== '0.1.0' || pkg.private) {
            throw new Error('Expected the initial public convertor package');
          }
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(pkg.name));
          if (response.status !== 404) {
            throw new Error('Expected an unpublished package (HTTP 404), got HTTP ' + response.status);
          }
          NODE

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Pack initial version
        run: npm pack --ignore-scripts

      - name: Stage initial version for maintainer approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Set NPM_BOOTSTRAP_TOKEN first' >&2; exit 1; }
          npm stage publish ./dice-roller-convertor-0.1.0.tgz --ignore-scripts --access public --tag latest --registry https://registry.npmjs.org
